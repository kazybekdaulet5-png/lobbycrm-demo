<!doctype html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Бронирование — LobbyCRM</title>

<!-- Google Fonts: Inter (тот же шрифт, что и в index.html) -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">

<!-- Tailwind (play CDN) -->
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    darkMode: 'class',
    theme: {
      extend: {
        fontFamily: { sans: ['Inter', 'ui-sans-serif', 'system-ui', 'sans-serif'] },
        colors: {
          brand: { 50:'#eef2ff',100:'#e0e7ff',400:'#818cf8',500:'#6366f1',600:'#4f46e5',700:'#4338ca' }
        },
        boxShadow: { card: '0 1px 2px rgba(0,0,0,.04), 0 8px 24px -8px rgba(0,0,0,.10)' }
      }
    }
  }
</script>

<style>
  :root{ --bg:#0b0f19; --fg:#e5e7eb; }
  html,body{ background:var(--bg); color:var(--fg); margin:0; font-family:'Inter',ui-sans-serif,system-ui,sans-serif; }
  ::-webkit-scrollbar{ width:8px; height:8px; }
  ::-webkit-scrollbar-thumb{ background:rgba(148,163,184,.35); border-radius:8px; }
  ::-webkit-scrollbar-track{ background:transparent; }
  @keyframes lc-slidein{ from{ transform:translateY(12px); opacity:0;} to{ transform:translateY(0); opacity:1;} }
  .lc-slidein{ animation: lc-slidein .35s ease-out; }
  [x-cloak]{ display:none !important; }
</style>
</head>
<body>

<!-- ==========================================================================
     LobbyCRM — «booking.html»: публичная страница онлайн-бронирования для гостей.

     Как это связано с index.html (админ-CRM):
     — Обе страницы читают/пишут ОДИН И ТОТ ЖЕ ключ localStorage: 'lobbycrm_v1'.
     — Когда гость бронирует стол здесь, мы находим его в state.zones, помечаем
       status:'reserved', подставляем имя/телефон и source:'online', и сохраняем
       ПОЛНЫЙ объект state обратно (чтобы не затереть бар/аналитику/другие столы).
     — index.html слушает событие 'storage' и мгновенно подхватывает изменения,
       если обе страницы открыты в разных вкладках ОДНОГО origin.

     ВАЖНО для локального теста и деплоя:
     localStorage разделяется только между страницами одного origin. Если открыть
     оба файла двойным кликом (file://), большинство браузеров дадут им РАЗНЫЕ
     изолированные хранилища, и синхронизация работать не будет. Нужно раздавать
     их через http(s):
       • GitHub Pages — просто положите index.html и booking.html в корень репозитория;
       • локально — из папки с файлами: `python3 -m http.server 8000`,
         затем открыть http://localhost:8000/index.html и http://localhost:8000/booking.html
========================================================================== -->

<div x-data="app()" x-init="init()" x-cloak :class="theme" class="min-h-screen bg-slate-100 text-slate-800 dark:bg-slate-950 dark:text-slate-100 transition-colors duration-300">

  <!-- ============ HEADER ============ -->
  <header class="sticky top-0 z-30 border-b border-slate-200/70 dark:border-slate-800/80 bg-white/80 dark:bg-slate-950/80 backdrop-blur-md">
    <div class="max-w-5xl mx-auto px-4 sm:px-6 py-3 flex items-center gap-3 flex-wrap">
      <div class="flex items-center gap-2.5">
        <div class="h-9 w-9 rounded-xl bg-gradient-to-br from-brand-500 to-brand-700 flex items-center justify-center text-white text-lg shadow-card">🎱</div>
        <div class="leading-tight">
          <div class="font-extrabold text-lg tracking-tight">LobbyCRM</div>
          <div class="text-xs text-slate-500 dark:text-slate-400">Онлайн-бронирование столов и приставок</div>
        </div>
      </div>

      <div class="ml-auto flex items-center gap-2">
        <a href="index.html" title="Вход для администратора" class="hidden sm:flex items-center gap-1.5 h-9 px-3 rounded-lg text-xs font-semibold text-slate-500 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors">
          Я администратор →
        </a>
        <button @click="toggleTheme()" title="Сменить тему" class="h-9 w-9 grid place-items-center rounded-lg text-slate-500 hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors">
          <svg x-show="theme==='dark'" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"></path></svg>
          <svg x-show="theme!=='dark'" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
        </button>
      </div>
    </div>

    <!-- category filter -->
    <div class="max-w-5xl mx-auto px-4 sm:px-6 pb-3 flex items-center gap-1">
      <div class="flex items-center gap-1 bg-slate-100 dark:bg-slate-900 rounded-xl p-1">
        <button @click="activeCategory='all'" :class="activeCategory==='all' ? 'bg-white dark:bg-slate-700 shadow text-slate-900 dark:text-white' : 'text-slate-500 dark:text-slate-400 hover:text-slate-700 dark:hover:text-slate-200'" class="px-3 py-1.5 rounded-lg text-sm font-semibold transition-all">Все</button>
        <button @click="activeCategory='billiard'" :class="activeCategory==='billiard' ? 'bg-white dark:bg-slate-700 shadow text-slate-900 dark:text-white' : 'text-slate-500 dark:text-slate-400 hover:text-slate-700 dark:hover:text-slate-200'" class="px-3 py-1.5 rounded-lg text-sm font-semibold transition-all">🎱 Бильярд</button>
        <button @click="activeCategory='ps5'" :class="activeCategory==='ps5' ? 'bg-white dark:bg-slate-700 shadow text-slate-900 dark:text-white' : 'text-slate-500 dark:text-slate-400 hover:text-slate-700 dark:hover:text-slate-200'" class="px-3 py-1.5 rounded-lg text-sm font-semibold transition-all">🎮 PlayStation 5</button>
      </div>
    </div>
  </header>

  <main class="max-w-5xl mx-auto px-4 sm:px-6 py-6">

    <div class="mb-5">
      <h1 class="text-xl font-extrabold mb-1">Забронировать стол на сегодня</h1>
      <p class="text-sm text-slate-500 dark:text-slate-400" x-text="'Сегодня, ' + todayLabel + ' · выберите время и оставьте контакты — стол будет ждать вас'"></p>
    </div>

    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
      <template x-for="zone in visibleZones()" :key="zone.id">
        <div class="rounded-2xl border shadow-card p-4 flex flex-col gap-3 bg-white dark:bg-slate-900"
             :class="zone.status==='free' ? 'border-emerald-300/60 dark:border-emerald-500/30' : 'border-slate-200/60 dark:border-slate-800 opacity-70'">
          <div class="flex items-start justify-between gap-2">
            <div>
              <div class="font-bold" x-text="zone.name"></div>
              <div class="text-xs text-slate-500 dark:text-slate-400" x-text="categoryLabel(zone.category)"></div>
            </div>
            <div class="text-right shrink-0">
              <div class="font-bold text-brand-600 dark:text-brand-400" x-text="fmtMoney(zone.rate)"></div>
              <div class="text-[11px] text-slate-400">/ час</div>
            </div>
          </div>

          <template x-if="zone.status==='free'">
            <div>
              <template x-if="availableSlots(zone).length">
                <div>
                  <div class="text-xs font-semibold text-slate-500 dark:text-slate-400 mb-2">Свободные часы сегодня</div>
                  <div class="flex flex-wrap gap-2">
                    <template x-for="slot in availableSlots(zone)" :key="slot">
                      <button @click="openBooking(zone.id, slot)" class="px-3 py-1.5 rounded-lg text-sm font-semibold border border-slate-200 dark:border-slate-700 hover:border-brand-500 hover:text-brand-600 dark:hover:text-brand-400 hover:bg-brand-50 dark:hover:bg-brand-500/10 transition-colors" x-text="slot"></button>
                    </template>
                  </div>
                </div>
              </template>
              <template x-if="!availableSlots(zone).length">
                <div class="text-sm text-slate-400">На сегодня свободных часов больше нет</div>
              </template>
            </div>
          </template>

          <template x-if="zone.status==='occupied'">
            <div class="flex items-center gap-2">
              <span class="h-1.5 w-1.5 rounded-full bg-red-500"></span>
              <span class="text-sm text-slate-500 dark:text-slate-400">Сейчас занято</span>
            </div>
          </template>

          <template x-if="zone.status==='reserved'">
            <div class="flex items-center gap-2">
              <span class="h-1.5 w-1.5 rounded-full bg-amber-500"></span>
              <span class="text-sm text-slate-500 dark:text-slate-400">Уже есть бронь на сегодня</span>
            </div>
          </template>
        </div>
      </template>

      <div x-show="visibleZones().length===0" class="sm:col-span-2 text-center text-slate-400 py-10">Нет столов в этой категории</div>
    </div>

    <p class="text-center text-xs text-slate-400 mt-8">
      Бронируя стол, вы соглашаетесь подойти в указанное время. Бронь автоматически видит администратор клуба —
      звонить и подтверждать не нужно.
    </p>
  </main>

  <!-- ============ MODAL: booking form ============ -->
  <template x-if="modalOpen">
    <div class="fixed inset-0 z-40 bg-black/40 backdrop-blur-sm flex items-center justify-center p-4" @click.self="closeModal()" x-transition.opacity>
      <div class="bg-white dark:bg-slate-900 rounded-2xl shadow-2xl w-full max-w-sm p-5" x-transition.scale.opacity>

        <!-- form step -->
        <template x-if="!bookingConfirmed">
          <div>
            <div class="flex items-center justify-between mb-1">
              <div class="font-bold text-lg" x-text="selected ? findZone(selected.zoneId).name : ''"></div>
              <button @click="closeModal()" class="text-slate-400 hover:text-slate-700 dark:hover:text-slate-200 text-xl leading-none">✕</button>
            </div>
            <div class="text-sm text-slate-500 dark:text-slate-400 mb-4">
              Сегодня в <span class="font-semibold text-brand-600 dark:text-brand-400" x-text="selected?.slot"></span>
            </div>

            <label class="block text-xs font-semibold text-slate-500 dark:text-slate-400 mb-1">Ваше имя</label>
            <input x-model="form.name" type="text" placeholder="Например, Аружан" class="w-full rounded-xl border border-slate-200 dark:border-slate-700 bg-transparent px-3 py-2.5 text-sm mb-3 focus:outline-none focus:ring-2 focus:ring-brand-500">

            <label class="block text-xs font-semibold text-slate-500 dark:text-slate-400 mb-1">Номер телефона</label>
            <input x-model="form.phone" type="tel" placeholder="+7 700 000 00 00" class="w-full rounded-xl border border-slate-200 dark:border-slate-700 bg-transparent px-3 py-2.5 text-sm mb-2 focus:outline-none focus:ring-2 focus:ring-brand-500">

            <div x-show="formError" x-text="formError" class="text-xs text-red-500 mb-2"></div>

            <button @click="confirmBooking()" class="w-full bg-brand-600 hover:bg-brand-700 text-white font-semibold rounded-xl py-3 mt-2 transition-colors">✅ Забронировать</button>
          </div>
        </template>

        <!-- success step -->
        <template x-if="bookingConfirmed">
          <div class="text-center py-2 lc-slidein">
            <div class="h-14 w-14 rounded-full bg-emerald-100 dark:bg-emerald-500/15 text-emerald-600 dark:text-emerald-400 grid place-items-center mx-auto mb-3 text-2xl">✓</div>
            <div class="font-extrabold text-lg mb-1">Бронь подтверждена!</div>
            <div class="text-sm text-slate-500 dark:text-slate-400 mb-4">
              «<span x-text="bookingConfirmed.zoneName"></span>» ждёт вас сегодня в
              <span class="font-semibold text-slate-700 dark:text-slate-200" x-text="bookingConfirmed.slot"></span>.
              Администратор клуба уже видит вашу бронь.
            </div>
            <button @click="closeModal()" class="w-full bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 font-semibold rounded-xl py-2.5 transition-colors">Готово</button>
          </div>
        </template>
      </div>
    </div>
  </template>

</div>

<!-- Alpine.js -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/alpinejs/3.13.5/cdn.min.js" defer></script>

<script>
  // =========================================================================
  // booking.html — логика клиентской страницы бронирования.
  // Общий контракт хранилища с index.html описан в комментарии в начале файла.
  // =========================================================================

  const STORAGE_KEY = 'lobbycrm_v1';
  const CLOSING_HOUR = 23; // клуб принимает брони на сегодня максимум до 23:00

  // Резервная копия столов на случай первого запуска (см. комментарий вверху файла).
  // Должна совпадать с seed() из index.html по id/name/category/rate.
  function SEED_ZONES() {
    const blank = { status: 'free', startedAt: null, reservedAt: null, reservedLabel: '', guestName: '', guestPhone: '', source: '', order: [] };
    return [
      { id: 1, name: 'Русский бильярд №1', category: 'billiard_ru', rate: 3000, ...blank },
      { id: 2, name: 'Русский бильярд №2', category: 'billiard_ru', rate: 3000, ...blank },
      { id: 3, name: 'Пул №1', category: 'billiard_pool', rate: 2500, ...blank },
      { id: 4, name: 'Пул №2', category: 'billiard_pool', rate: 2500, ...blank },
      { id: 5, name: 'PS5 №1', category: 'ps5', rate: 2000, ...blank },
      { id: 6, name: 'PS5 №2', category: 'ps5', rate: 2000, ...blank },
      { id: 7, name: 'PS5 №3', category: 'ps5', rate: 2000, ...blank },
      { id: 8, name: 'PS5 VIP (2 экрана)', category: 'ps5', rate: 3500, ...blank },
    ];
  }

  function app() {
    return {
      // ---- состояние UI ----
      theme: 'dark',
      activeCategory: 'all',
      zones: [],
      selected: null,          // { zoneId, slot }
      modalOpen: false,
      bookingConfirmed: null,  // { zoneName, slot } — после успешной брони
      form: { name: '', phone: '' },
      formError: '',
      todayLabel: '',

      init() {
        const state = this.loadFullState();
        this.zones = state.zones;
        this.theme = state.theme || 'dark';
        this.todayLabel = new Date().toLocaleDateString('ru-RU', { day: '2-digit', month: 'long' });

        // Если админ (в другой вкладке того же origin) меняет данные — подхватываем.
        window.addEventListener('storage', (e) => {
          if (e.key !== STORAGE_KEY || !e.newValue) return;
          try { this.zones = JSON.parse(e.newValue).zones || this.zones; } catch (err) {}
        });

        // Подстраховка на случай, если браузер не прислал событие 'storage'
        // (например, страница была открыта раньше и провисела долго открытой).
        setInterval(() => {
          const fresh = this.loadFullState();
          this.zones = fresh.zones;
        }, 30000);
      },

      // =======================================================================
      // ХРАНИЛИЩЕ (тот же ключ и та же структура, что в index.html)
      // =======================================================================
      loadFullState() {
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          if (raw) return JSON.parse(raw);
        } catch (e) { /* localStorage недоступен или данные повреждены */ }
        return { zones: SEED_ZONES(), bar: [], sessionsLog: [], shiftStartedAt: Date.now(), theme: 'dark' };
      },
      saveFullState(state) {
        try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (e) {}
      },

      // =======================================================================
      // ПОМОЩНИКИ
      // =======================================================================
      findZone(id) { return this.zones.find(z => z.id === id); },
      categoryLabel(cat) {
        return cat === 'billiard_ru' ? 'Русский бильярд' : cat === 'billiard_pool' ? 'Пул' : 'PlayStation 5';
      },
      visibleZones() {
        return this.zones.filter(z => {
          if (this.activeCategory === 'all') return true;
          if (this.activeCategory === 'billiard') return z.category === 'billiard_ru' || z.category === 'billiard_pool';
          return z.category === 'ps5';
        });
      },
      fmtMoney(n) { return Math.round(n || 0).toLocaleString('ru-RU') + ' ₸'; },

      // Свободные часы «на сегодня» для стола: с ближайшего полного часа и до закрытия.
      // Упрощение демо: у каждого стола одновременно может быть только одна бронь —
      // если он occupied/reserved, слоты на сегодня не предлагаем (как и в index.html).
      availableSlots(zone) {
        if (zone.status !== 'free') return [];
        const now = new Date();
        let startHour = now.getHours() + 1;
        if (now.getMinutes() >= 45) startHour++; // если почти следующий час — предлагаем через час
        const slots = [];
        for (let h = startHour; h <= CLOSING_HOUR; h++) slots.push(String(h).padStart(2, '0') + ':00');
        return slots;
      },

      // =======================================================================
      // МОДАЛЬНОЕ ОКНО БРОНИРОВАНИЯ
      // =======================================================================
      openBooking(zoneId, slot) {
        this.selected = { zoneId, slot };
        this.form = { name: '', phone: '' };
        this.formError = '';
        this.bookingConfirmed = null;
        this.modalOpen = true;
      },
      closeModal() {
        this.modalOpen = false;
        this.selected = null;
        this.bookingConfirmed = null;
      },
      isValidPhone(v) { return /^[0-9+\-\s()]{7,20}$/.test((v || '').trim()); },

      confirmBooking() {
        if (!this.form.name.trim()) { this.formError = 'Введите имя'; return; }
        if (!this.isValidPhone(this.form.phone)) { this.formError = 'Введите корректный номер телефона'; return; }

        // Перечитываем актуальное состояние прямо перед записью — вдруг стол
        // за это время заняли из другой вкладки (админ или другой гость).
        const state = this.loadFullState();
        const zone = state.zones.find(z => z.id === this.selected.zoneId);
        if (!zone || zone.status !== 'free') {
          this.formError = 'Извините, этот стол уже забронирован. Обновите страницу и выберите другой.';
          this.zones = state.zones;
          return;
        }

        const [hh] = this.selected.slot.split(':');
        const today = new Date();
        const slotDate = new Date(today.getFullYear(), today.getMonth(), today.getDate(), parseInt(hh, 10), 0, 0, 0);

        zone.status = 'reserved';
        zone.reservedAt = slotDate.getTime();
        zone.reservedLabel = 'сегодня в ' + this.selected.slot;
        zone.guestName = this.form.name.trim();
        zone.guestPhone = this.form.phone.trim();
        zone.source = 'online';

        this.saveFullState(state);
        this.zones = state.zones;
        this.bookingConfirmed = { zoneName: zone.name, slot: this.selected.slot };
        this.formError = '';
      },

      // =======================================================================
      // ТЕМА (общий ключ с index.html, но каждая страница хранит свой выбор
      // отдельно в рамках общего объекта state — переключение здесь не влияет
      // на тему в CRM, чтобы не дёргать интерфейс администратора)
      // =======================================================================
      toggleTheme() { this.theme = this.theme === 'dark' ? 'light' : 'dark'; },
    };
  }
</script>
</body>
</html>
